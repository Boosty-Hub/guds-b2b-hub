# Compila, firma y (opcionalmente) sube a App Store Connect el shell nativo iOS "Guds Store".
# No hay Mac en el equipo: iOS se compila y firma solo aquí.
#
# Secrets requeridos (Settings > Secrets and variables > Actions):
#   IOS_CERT_P12              base64 del .p12 (Apple Distribution + clave privada)
#   IOS_CERT_PASSWORD         contraseña del .p12
#   IOS_PROVISIONING_PROFILE  base64 del perfil App Store "Guds Store App Store CI"
#   ASC_API_KEY_P8            base64 de AuthKey_<KEY_ID>.p8 (solo si upload=true)
#   ASC_KEY_ID, ASC_ISSUER_ID App Store Connect API key (solo si upload=true)
#
# Las variables VITE_* vienen del archivo .env versionado en el repo. El shell carga el
# portal en vivo (server.url en capacitor.config.ts); el dist/ empaquetado es solo respaldo.

name: iOS Release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Subir el .ipa a App Store Connect (TestFlight)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  ios:
    name: Build iOS (App Store)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TEAM_ID: 45TRWF6998
      BUNDLE_ID: com.guds.guds
      PROFILE_NAME: Guds Store App Store CI
      EXPECTED_VERSION: 1.2.1
      EXPECTED_BUILD: "101"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Verificar SDK de iOS >= 26
        run: |
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          SDK_MAJOR="${SDK_VERSION%%.*}"
          echo "Xcode: $(xcodebuild -version | head -n 1) | iOS SDK: $SDK_VERSION"
          if [ "$SDK_MAJOR" -lt 26 ]; then
            echo "::error::Se requiere el SDK de iOS 26 o superior (encontrado: $SDK_VERSION)."
            exit 1
          fi

      - name: Verificar versión y build del proyecto
        run: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          check_setting() {
            local key="$1" expected="$2" values
            values="$(grep -E "^[[:space:]]*${key} = " "$PBXPROJ" | sed -E 's/.*= "?([^";]*)"?;.*/\1/' | sort -u || true)"
            if [ "$values" != "$expected" ]; then
              echo "::error::${key} en project.pbxproj es '${values//$'\n'/, }', se esperaba '${expected}'."
              exit 1
            fi
            echo "${key} = ${values}"
          }
          check_setting MARKETING_VERSION "$EXPECTED_VERSION"
          check_setting CURRENT_PROJECT_VERSION "$EXPECTED_BUILD"

      - name: Build web y cap sync
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Instalar certificado y perfil de aprovisionamiento
        env:
          IOS_CERT_P12: ${{ secrets.IOS_CERT_P12 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          for name in IOS_CERT_P12 IOS_CERT_PASSWORD IOS_PROVISIONING_PROFILE; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secret ${name}."; exit 1; fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/guds-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT_PATH="$RUNNER_TEMP/guds_dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/guds_appstore.mobileprovision"

          printf '%s' "$IOS_CERT_P12" | base64 --decode > "$CERT_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          # Keychain desechable para esta ejecución.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -f pkcs12 -P "$IOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          # Validar el perfil antes de instalarlo.
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_REAL_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_APS="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist")"
          PROFILE_EXP="$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$RUNNER_TEMP/profile.plist")"
          echo "Perfil: '$PROFILE_REAL_NAME' ($PROFILE_UUID), aps-environment=$PROFILE_APS, expira $PROFILE_EXP"
          if [ "$PROFILE_REAL_NAME" != "$PROFILE_NAME" ]; then
            echo "::error::El perfil se llama '$PROFILE_REAL_NAME', se esperaba '$PROFILE_NAME'."
            exit 1
          fi
          if [ "$PROFILE_APS" != "production" ]; then
            echo "::error::El perfil no incluye aps-environment=production."
            exit 1
          fi

          # Ruta clásica + ruta usada por Xcode 16 en adelante.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE_PATH" "$dir/$PROFILE_UUID.mobileprovision"
          done
          rm -f "$PROFILE_PATH" "$RUNNER_TEMP/profile.plist"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Archive (xcodebuild)
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/build/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Exportar .ipa
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
            <key>destination</key>
            <string>export</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF
          plutil -lint "$EXPORT_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/build/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/build/export" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          IPA_PATH="$(find "$RUNNER_TEMP/build/export" -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then echo "::error::No se generó ningún .ipa."; exit 1; fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/build/export"

      - name: Verificar .ipa (bundle id, versión, build, entitlements)
        run: |
          WORK="$RUNNER_TEMP/ipa-check"
          rm -rf "$WORK" && mkdir -p "$WORK"
          unzip -q "$IPA_PATH" -d "$WORK"
          APP_PATH="$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -n 1)"
          PLIST="$APP_PATH/Info.plist"

          fail=0
          expect() {
            if [ "$2" != "$3" ]; then echo "::error::$1 es '$2', se esperaba '$3'."; fail=1; else echo "OK $1 = $2"; fi
          }
          expect CFBundleIdentifier "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")" "$BUNDLE_ID"
          expect CFBundleShortVersionString "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" "$EXPECTED_VERSION"
          expect CFBundleVersion "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" "$EXPECTED_BUILD"

          codesign -d --entitlements :- "$APP_PATH" > "$WORK/entitlements.plist" 2>/dev/null || true
          echo "Entitlements firmados:" && cat "$WORK/entitlements.plist"
          expect aps-environment "$(/usr/libexec/PlistBuddy -c 'Print :aps-environment' "$WORK/entitlements.plist" 2>/dev/null || true)" "production"
          expect application-identifier "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$WORK/entitlements.plist" 2>/dev/null || true)" "$TEAM_ID.$BUNDLE_ID"
          if codesign --verify --deep --strict "$APP_PATH"; then
            echo "OK firma válida"
          else
            echo "::error::codesign --verify falló para $APP_PATH."; fail=1
          fi

          exit "$fail"

      - name: Subir .ipa como artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guds-store-ios-${{ env.EXPECTED_VERSION }}-${{ env.EXPECTED_BUILD }}
          path: ${{ runner.temp }}/build/export/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Subir a App Store Connect
        if: ${{ inputs.upload }}
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          for name in ASC_API_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secret ${name}."; exit 1; fi
          done
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$API_PRIVATE_KEYS_DIR"
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$API_PRIVATE_KEYS_DIR/AuthKey_${ASC_KEY_ID}.p8"

          xcrun altool --upload-app --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Limpiar keychain y archivos temporales
        if: always()
        run: |
          KEYCHAIN_PATH="${KEYCHAIN_PATH:-$RUNNER_TEMP/guds-signing.keychain-db}"
          security default-keychain -d user -s login.keychain-db || true
          if [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/ipa-check"
          rm -f "$RUNNER_TEMP/guds_dist.p12" "$RUNNER_TEMP/guds_appstore.mobileprovision" \
            "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/ExportOptions.plist"
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
