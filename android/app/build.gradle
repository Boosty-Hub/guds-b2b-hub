apply plugin: 'com.android.application'

// La firma de release lee la llave de subida del entorno (CI) y, si no está, de android/keystore.properties (builds
// locales). Ni el keystore ni ese archivo se versionan nunca. Sin credenciales, una tarea de release se detiene antes de
// correr, en vez de producir en silencio un bundle sin firmar que Play rechazaría.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String envName, String propName ->
    def fromEnv = System.getenv(envName)
    return fromEnv ? fromEnv : keystoreProps.getProperty(propName)
}
def releaseStoreFile = signingValue('ANDROID_KEYSTORE_PATH', 'storeFile')
def releaseStorePassword = signingValue('ANDROID_KEYSTORE_PASSWORD', 'storePassword')
def releaseKeyAlias = signingValue('ANDROID_KEY_ALIAS', 'keyAlias')
def releaseKeyPassword = signingValue('ANDROID_KEY_PASSWORD', 'keyPassword')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// Play rechaza un versionCode que ya recibió: CI pasa uno por ejecución (run_number + 100). Un build local usa 100
// salvo que se pase -PversionCode=<n>. versionName sigue a iOS (MARKETING_VERSION).
def resolvedVersionCode = (System.getenv('ANDROID_VERSION_CODE') ?: findProperty('versionCode') ?: '100') as Integer
def resolvedVersionName = (System.getenv('ANDROID_VERSION_NAME') ?: findProperty('versionName') ?: '1.2.0') as String

android {
    namespace = "com.guds.guds"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.guds.guds"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                def store = new File(releaseStoreFile)
                storeFile(store.isAbsolute() ? store : rootProject.file(releaseStoreFile))
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Sin signingConfig, AGP igual arma el bundle de release, solo que sin firmar. Se detiene antes de la primera tarea,
// cuando todavía es barato y queda claro por qué.
gradle.taskGraph.whenReady { graph ->
    def releaseTask = graph.allTasks.find { t ->
        t.project == project && t.name ==~ /(bundle|assemble|package|sign|publish|install)\w*Release\w*/
    }
    if (releaseTask && !hasReleaseSigning) {
        throw new GradleException(
            "La firma de release no está configurada: ${releaseTask.path} produciría un build sin firmar. " +
            "Define ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD, " +
            "o crea android/keystore.properties con storeFile, storePassword, keyAlias y keyPassword.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Builds locales: sin google-services.json no se aplica el plugin (y el push no funciona). CI exige el archivo y
// verifica que traiga el cliente com.guds.guds antes de compilar (.github/workflows/android-release.yml).
try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
