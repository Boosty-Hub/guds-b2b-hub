[build]
  command = "bun run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# La letra no cambia de nombre al actualizarse: caché larga en el navegador y en la CDN
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Estado de cuenta público por enlace (fase 20w): el token va en la URL. No indexar, no mandarlo como Referer y sin caché.
[[headers]]
  for = "/estado-cuenta/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"
